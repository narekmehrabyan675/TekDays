welcome.head = \u0532\u0561\u0580\u056B \u0563\u0561\u056C\u0578\u0582\u057D\u057F TekDays:
welcome.title1 = TekDays.com-\u0568 \u057E\u0565\u0562\u056F\u0561\u0575\u0584 \u0567, \u0578\u0580\u0568 \u0576\u0561\u056D\u0561\u057F\u0565\u057D\u057E\u0561\u056E \u0567 \u0561\u0576\u0570\u0561\u057F\u0576\u0565\u0580\u056B\u0576 \u0587 \u0570\u0561\u0574\u0561\u0575\u0576\u0584\u0576\u0565\u0580\u056B\u0576 \u0585\u0563\u0576\u0565\u056C\u0578\u0582 \u057F\u0565\u056D\u0576\u0578\u056C\u0578\u0563\u056B\u0561\u056F\u0561\u0576 \u0570\u0561\u0574\u0561\u056A\u0578\u0572\u0578\u057E\u0576\u0565\u0580\u056B \u056F\u0561\u0566\u0574\u0561\u056F\u0565\u0580\u057A\u0574\u0561\u0576 \u0570\u0561\u0580\u0581\u0578\u0582\u0574\u055D \u0574\u056B\u0561\u057E\u0578\u0580\u0565\u056C\u0578\u0582 \u0574\u0565\u056E \u0574\u057F\u0584\u0565\u0580\u0576 \u0578\u0582 \u0570\u0561\u0574\u0561\u057F\u0565\u0572 \u0570\u0565\u057F\u0561\u0584\u0580\u0584\u0580\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0576\u0565\u0580\u0568 \u0570\u0561\u0576\u0578\u0582\u0576 \u056C\u0561\u0575\u0576 \u057F\u0565\u056D\u0576\u0578\u0563\u056B\u056F \u0570\u0561\u0574\u0561\u0575\u0576\u0584\u056B:
welcome.title2 = \u054F\u0565\u057D\u0565\u0584\u055D \u0561\u0580\u0564\u0575\u0578\u0584 \u0574\u0577\u0561\u056F\u0574\u0561\u0576 \u0583\u0578\u0582\u056C\u0578\u0582\u0574 \u056F\u0561 \u0578\u0580\u0587\u0567 \u057F\u0565\u056D\u0576\u056B\u056F\u0561\u056F\u0561\u0576 \u0574\u056B\u057B\u0578\u0581\u0561\u057C\u0578\u0582\u0574, \u0578\u0580\u0568 \u0571\u0565\u0566 \u0570\u0565\u057F\u0561\u0584\u0580\u0584\u0580\u0578\u0582\u0574 \u0567\u0589 \u0535\u0569\u0565 \u056F\u0561, \u0564\u0578\u0582\u0584 \u056F\u0561\u0580\u0578\u0572 \u0565\u0584 \u056F\u0561\u0574\u0561\u057E\u0578\u0580 \u056F\u0565\u0580\u057A\u0578\u057E \u0585\u0563\u0576\u0565\u056C \u056F\u0561\u0574 \u057A\u0561\u0580\u0566\u0561\u057A\u0565\u057D \u057F\u0565\u0572\u0565\u056F\u0561\u0581\u0576\u0565\u056C \u056F\u0561\u0566\u0574\u0561\u056F\u0565\u0580\u057A\u056B\u0579\u0576\u0565\u0580\u056B\u0576, \u0578\u0580 \u0571\u0565\u0566 \u0570\u0565\u057F\u0561\u0584\u0580\u0584\u056B\u0580 \u056F\u056C\u056B\u0576\u056B \u0574\u0561\u057D\u0576\u0561\u056F\u0581\u0565\u056C\u0589 \u0545\u0578\u0582\u0580\u0561\u0584\u0561\u0576\u0579\u0575\u0578\u0582\u0580\u0568 \u0578\u0582\u0576\u056B \u056B\u0580 \u0564\u0565\u0580\u0568\u0589
welcome.title3 = \u0535\u0569\u0565 \u0564\u0578\u0582\u0584 \u0579\u0565\u0584 \u057F\u0565\u057D\u0576\u0578\u0582\u0574 \u0578\u0580\u0587\u0567 \u0562\u0561\u0576, \u0578\u0580\u0568 \u0570\u0561\u0574\u0561\u057A\u0561\u057F\u0561\u057D\u056D\u0561\u0576\u0578\u0582\u0574 \u0567 \u0571\u0565\u0580 \u0570\u0565\u057F\u0561\u0584\u0580\u0584\u0580\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0576\u0565\u0580\u056B\u0576 \u0587 \u0563\u057F\u0576\u057E\u0565\u056C\u0578\u0582 \u057E\u0561\u0575\u0580\u056B\u0576, \u0561\u057A\u0561 \u056B\u0576\u0579\u0578\u0582 \u0579\u057D\u056F\u057D\u0565\u056C \u056B\u0576\u0584\u0576\u0565\u0580\u0564\u0589 \u054D\u056F\u057D\u0565\u056C\u0568 \u0570\u0565\u0577\u057F \u0567, \u0587 \u0563\u0578\u0582\u0581\u0565 \u056F\u0561\u0576 \u0578\u0582\u0580\u056B\u0577\u0576\u0565\u0580, \u0578\u057E\u0584\u0565\u0580 \u057A\u0561\u057F\u0580\u0561\u057D\u057F \u0565\u0576 \u0561\u057B\u0561\u056F\u0581\u0565\u056C, \u0578\u0580\u057A\u0565\u057D\u0566\u056B \u0564\u0561 \u056B\u0580\u0561\u056F\u0561\u0576\u0561\u0581\u057E\u056B\u0589
welcome.title4 = \u0535\u0569\u0565 \u0564\u0578\u0582\u0584 \u057F\u0565\u056D\u0576\u0578\u056C\u0578\u0563\u056B\u0561\u0576\u0565\u0580\u056B \u0570\u0565\u057F \u056F\u0561\u057A\u057E\u0561\u056E \u0568\u0576\u056F\u0565\u0580\u0578\u0582\u0569\u0575\u0561\u0576 \u056F\u0561\u0574 \u056F\u0561\u0566\u0574\u0561\u056F\u0565\u0580\u057A\u0578\u0582\u0569\u0575\u0561\u0576 \u0574\u0561\u057D \u0565\u0584 \u056F\u0561\u0566\u0574\u0578\u0582\u0574, \u0561\u057A\u0561 \u057F\u0565\u056D\u0576\u0578\u056C\u0578\u0563\u056B\u0561\u056F\u0561\u0576 \u0574\u056B\u057B\u0578\u0581\u0561\u057C\u0574\u0561\u0576 \u0570\u0578\u057E\u0561\u0576\u0561\u057E\u0578\u0580\u0578\u0582\u0569\u0575\u0578\u0582\u0576\u0568 \u0570\u0580\u0561\u0577\u0561\u056C\u056B \u0574\u056B\u057B\u0578\u0581 \u0567 \u0570\u0561\u0574\u0561\u0575\u0576\u0584\u056B\u0576 \u057F\u0565\u0572\u0565\u056F\u0561\u0581\u0576\u0565\u056C\u0578\u0582 \u0571\u0565\u0580 \u0576\u0565\u0580\u056F\u0561\u0575\u0578\u0582\u0569\u0575\u0561\u0576 \u0587 \u0576\u0565\u0580\u0563\u0580\u0561\u057E\u057E\u0561\u056E\u0578\u0582\u0569\u0575\u0561\u0576 \u0574\u0561\u057D\u056B\u0576\u0589
