welcome.head = \u0414\u043E\u0431\u0440\u043E \u043F\u043E\u0436\u0430\u043B\u043E\u0432\u0430\u0442\u044C \u043D\u0430 TekDays:
welcome.title1 = TekDays.com \u2014 \u044D\u0442\u043E \u0432\u0435\u0431-\u0441\u0430\u0439\u0442, \u043F\u0440\u0435\u0434\u043D\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u043D\u044B\u0439 \u0434\u043B\u044F \u043F\u043E\u043C\u043E\u0449\u0438 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u043C \u043B\u0438\u0446\u0430\u043C \u0438 \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0430\u043C \u0432 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u0438 \u0442\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0439, \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u044F\u044F \u0431\u043E\u043B\u044C\u0448\u0438\u0435 \u0438\u0434\u0435\u0438 \u0438 \u043E\u0431\u0449\u0438\u0435 \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u044B \u0440\u0430\u0434\u0438 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0430.
welcome.title2 = \u041F\u043E\u0441\u043C\u043E\u0442\u0440\u0438\u0442\u0435, \u043D\u0430\u0445\u043E\u0434\u044F\u0442\u0441\u044F \u043B\u0438 \u0432 \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0435 \u043A\u0430\u043A\u0438\u0435-\u043B\u0438\u0431\u043E \u043C\u0435\u0440\u043E\u043F\u0440\u0438\u044F\u0442\u0438\u044F, \u043A\u043E\u0442\u043E\u0440\u044B\u0435 \u0432\u0430\u0441 \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u0443\u044E\u0442. \u0415\u0441\u043B\u0438 \u0434\u0430, \u0432\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u043F\u043E\u043C\u043E\u0447\u044C \u043A\u0430\u043A \u0432\u043E\u043B\u043E\u043D\u0442\u0451\u0440 \u0438\u043B\u0438 \u043F\u0440\u043E\u0441\u0442\u043E \u0443\u0432\u0435\u0434\u043E\u043C\u0438\u0442\u044C \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0442\u043E\u0440\u043E\u0432 \u043E \u0441\u0432\u043E\u0451\u043C \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u0435. \u0423 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0435\u0441\u0442\u044C \u0441\u0432\u043E\u044F \u0440\u043E\u043B\u044C.
welcome.title3 = \u0415\u0441\u043B\u0438 \u0432\u044B \u043D\u0435 \u043D\u0430\u0445\u043E\u0434\u0438\u0442\u0435 \u043D\u0438\u0447\u0435\u0433\u043E, \u0447\u0442\u043E \u0441\u043E\u043E\u0442\u0432\u0435\u0442\u0441\u0442\u0432\u0443\u0435\u0442 \u0432\u0430\u0448\u0438\u043C \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u0430\u043C \u0438\u043B\u0438 \u043C\u0435\u0441\u0442\u043E\u043F\u043E\u043B\u043E\u0436\u0435\u043D\u0438\u044E, \u043F\u043E\u0447\u0435\u043C\u0443 \u0431\u044B \u043D\u0435 \u043D\u0430\u0447\u0430\u0442\u044C \u0441\u0432\u043E\u0451 \u0441\u043E\u0431\u0441\u0442\u0432\u0435\u043D\u043D\u043E\u0435 \u043C\u0435\u0440\u043E\u043F\u0440\u0438\u044F\u0442\u0438\u0435? \u042D\u0442\u043E \u043B\u0435\u0433\u043A\u043E, \u0438, \u0432\u043E\u0437\u043C\u043E\u0436\u043D\u043E, \u043D\u0430\u0439\u0434\u0443\u0442\u0441\u044F \u0434\u0440\u0443\u0433\u0438\u0435, \u043A\u0442\u043E \u0433\u043E\u0442\u043E\u0432 \u043F\u043E\u0434\u0434\u0435\u0440\u0436\u0430\u0442\u044C.
welcome.title4 = \u0415\u0441\u043B\u0438 \u0432\u044B \u043F\u0440\u0435\u0434\u0441\u0442\u0430\u0432\u043B\u044F\u0435\u0442\u0435 \u043A\u043E\u043C\u043F\u0430\u043D\u0438\u044E \u0438\u043B\u0438 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u044E, \u0441\u0432\u044F\u0437\u0430\u043D\u043D\u0443\u044E \u0441 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u044F\u043C\u0438, \u0441\u043F\u043E\u043D\u0441\u043E\u0440\u0441\u0442\u0432\u043E \u0442\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u043E\u0433\u043E \u043C\u0435\u0440\u043E\u043F\u0440\u0438\u044F\u0442\u0438\u044F \u2014 \u043E\u0442\u043B\u0438\u0447\u043D\u044B\u0439 \u0441\u043F\u043E\u0441\u043E\u0431 \u0437\u0430\u044F\u0432\u0438\u0442\u044C \u043E \u0441\u0432\u043E\u0451\u043C \u043F\u0440\u0438\u0441\u0443\u0442\u0441\u0442\u0432\u0438\u0438 \u0438 \u0432\u043E\u0432\u043B\u0435\u0447\u0451\u043D\u043D\u043E\u0441\u0442\u0438 \u0432 \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u043E.
