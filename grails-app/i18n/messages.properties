welcome.head = Welcome to TekDays!
welcome.title1 = TekDays.com is a site dedicated to assisting individuals and communities to organize technology conferences. To bring great minds with common interests and passions together for the good of greater geekdom!
welcome.title2 = See if there's a technical event in the works that strikes yourfancy. If there is, you can volunteer to help or just let the organizers know that you'd be interested in attending. Everybody has a role to play.
welcome.title3 = If you don't see anything that suits your interest and location, then why not get the ball rolling. It's easy to get started and there may be others out there ready to get behind you to make it happen.
welcome.title4 = If you are part of a business or organization that is involved in technology then sponsoring a tek event would be a great way to let the community know that you're there and you're involved.
