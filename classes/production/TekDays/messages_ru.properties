welcome.title1 = TekDays.com \u2014 \u044D\u0442\u043E \u0441\u0430\u0439\u0442, \u043F\u0440\u0435\u0434\u043D\u0430\u0437\u043D\u0430\u0447\u0435\u043D\u043D\u044B\u0439 \u0434\u043B\u044F \u043F\u043E\u043C\u043E\u0449\u0438 \u043E\u0442\u0434\u0435\u043B\u044C\u043D\u044B\u043C \u043B\u0438\u0446\u0430\u043C \u0438 \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0430\u043C \u0432 \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0446\u0438\u0438 \u0442\u0435\u0445\u043D\u043E\u043B\u043E\u0433\u0438\u0447\u0435\u0441\u043A\u0438\u0445 \u043A\u043E\u043D\u0444\u0435\u0440\u0435\u043D\u0446\u0438\u0439. \u0427\u0442\u043E\u0431\u044B \u043E\u0431\u044A\u0435\u0434\u0438\u043D\u0438\u0442\u044C \u0432\u0435\u043B\u0438\u043A\u0438\u0435 \u0443\u043C\u044B \u0441 \u043E\u0431\u0449\u0438\u043C\u0438 \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u0430\u043C\u0438 \u0438 \u0441\u0442\u0440\u0430\u0441\u0442\u044F\u043C\u0438 \u043D\u0430 \u0431\u043B\u0430\u0433\u043E \u0431\u043E\u043B\u044C\u0448\u0435\u0433\u043E \u0441\u043E\u043E\u0431\u0449\u0435\u0441\u0442\u0432\u0430 \u0433\u0438\u043A\u043E\u0432!
welcome.title2 = \u041F\u043E\u0441\u043C\u043E\u0442\u0440\u0438\u0442\u0435, \u0435\u0441\u0442\u044C \u043B\u0438 \u0432 \u0440\u0430\u0437\u0440\u0430\u0431\u043E\u0442\u043A\u0435 \u0442\u0435\u0445\u043D\u0438\u0447\u0435\u0441\u043A\u043E\u0435 \u043C\u0435\u0440\u043E\u043F\u0440\u0438\u044F\u0442\u0438\u0435, \u043A\u043E\u0442\u043E\u0440\u043E\u0435 \u0432\u0430\u043C \u043D\u0440\u0430\u0432\u0438\u0442\u0441\u044F. \u0415\u0441\u043B\u0438 \u0435\u0441\u0442\u044C, \u0432\u044B \u043C\u043E\u0436\u0435\u0442\u0435 \u0434\u043E\u0431\u0440\u043E\u0432\u043E\u043B\u044C\u043D\u043E \u043F\u043E\u043C\u043E\u0447\u044C \u0438\u043B\u0438 \u043F\u0440\u043E\u0441\u0442\u043E \u0434\u0430\u0442\u044C \u0437\u043D\u0430\u0442\u044C \u043E\u0440\u0433\u0430\u043D\u0438\u0437\u0430\u0442\u043E\u0440\u0430\u043C, \u0447\u0442\u043E \u0432\u0430\u043C \u0431\u044B\u043B\u043E \u0431\u044B \u0438\u043D\u0442\u0435\u0440\u0435\u0441\u043D\u043E \u043F\u043E\u0441\u0435\u0442\u0438\u0442\u044C \u0435\u0433\u043E. \u0423 \u043A\u0430\u0436\u0434\u043E\u0433\u043E \u0435\u0441\u0442\u044C \u0441\u0432\u043E\u044F \u0440\u043E\u043B\u044C.
